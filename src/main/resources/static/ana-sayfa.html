<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Grand Resort - Lüksün Yeni Adresi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; background-color: #000; }
        
        /* Tam Ekran Hero (Arka Plan Görseli) */
        .hero {
            height: 100vh;
            /* Ege/Bodrum tarzı ferah bir deniz görseli */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
        }

        /* Şeffaf Üst Menü */
        .navbar {
            background: transparent !important;
            padding: 30px 50px;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }
        .navbar-brand { 
            font-family: 'Playfair Display', serif; 
            font-size: 26px; 
            color: white !important; 
            letter-spacing: 4px; 
        }
        .nav-link { 
            color: white !important; 
            font-size: 12px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin: 0 20px; 
            transition: 0.3s;
        }
        .nav-link:hover { color: #d4af37 !important; }
        
        /* Sağ Üstteki Rezervasyon Butonu */
        .btn-book-nav {
            border: 1px solid white;
            color: white;
            padding: 12px 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            text-decoration: none;
            transition: 0.4s;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .btn-book-nav:hover { background: white; color: black; }

        /* Ortadaki İddialı Yazılar */
        .hero-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 5.5rem; 
            letter-spacing: 8px; 
            margin-bottom: 15px; 
            font-weight: 400; 
            text-shadow: 2px 4px 15px rgba(0,0,0,0.3);
        }
        .hero-subtitle { 
            font-size: 1.1rem; 
            letter-spacing: 6px; 
            font-weight: 300; 
            margin-bottom: 60px; 
            text-transform: uppercase; 
        }
        
        /* Alt Kısımdaki Hızlı Arama Barı (Bulanık Efektli) */
        .booking-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 25px 40px;
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .booking-bar .form-group { text-align: left; }
        .booking-bar label { 
            font-size: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: rgba(255,255,255,0.8); 
            margin-bottom: 5px; 
        }
        .booking-bar .form-control { 
            background: transparent; 
            border: none; 
            border-bottom: 1px solid rgba(255,255,255,0.5); 
            border-radius: 0; 
            color: white; 
            padding: 5px 0;
            font-size: 15px;
        }
        .booking-bar .form-control:focus { box-shadow: none; border-bottom-color: white; }
        .booking-bar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        .btn-bar { 
            background: white; 
            color: black; 
            border: none; 
            padding: 12px 40px; 
            letter-spacing: 2px; 
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 500; 
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-bar:hover { background: #111; color: white; }
    </style>
</head>
<body>

<!-- Şeffaf Navigasyon -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">GRAND RESORT</a>
        <div class="collapse navbar-collapse justify-content-center">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Konaklama</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Restoran & Bar</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Spa & Wellness</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Deneyimler</a></li>
            </ul>
        </div>
        <!-- Rezervasyon Formuna Yönlendiren Buton -->
        <a href="musteri-paneli.html" class="btn-book-nav">Hemen Rezervasyon Yap</a>
    </div>
</nav>

<!-- Tam Ekran Vitrin -->
<div class="hero">
    <h1 class="hero-title">Ege'nin Kalbinde</h1>
    <p class="hero-subtitle">Lüks Ve Doğanın Kusursuz Uyumu</p>
    
    <!-- Hızlı Müsaitlik Barı (Forma Yönlendirir) -->
    <div class="booking-bar">
        <div class="form-group">
            <label>Giriş Tarihi</label>
            <input type="date" class="form-control">
        </div>
        <div class="form-group">
            <label>Çıkış Tarihi</label>
            <input type="date" class="form-control">
        </div>
        <div class="ms-2 pt-3">
            <a href="musteri-paneli.html" class="btn btn-bar">Müsaitlik Ara</a>
        </div>
    </div>
</div>

</body>
</html>
