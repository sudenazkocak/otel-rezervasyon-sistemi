<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Misafir Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 15px 20px; display: block; font-size: 1.1rem; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; border-left: 4px solid #0d6efd; }
        .sidebar i { margin-right: 10px; width: 25px; }
        .main-content { padding: 30px; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 sidebar position-fixed">
            <h4 class="text-center text-white mb-4 border-bottom pb-3"><i class="fas fa-hotel"></i> Grand Otel</h4>
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> Ana Panel</a>
            <a href="rezervasyon-listesi.html"><i class="fas fa-book"></i> Rezervasyonlar</a>
            <a href="rezervasyon-yap.html"><i class="fas fa-calendar-plus"></i> Yeni Rezervasyon</a>
            <a href="misafir-ekle.html" class="active"><i class="fas fa-user-plus"></i> Misafir Ekle</a>
            <a href="personel-listesi.html"><i class="fas fa-id-badge"></i> Personel Yönetimi</a>
            <a href="#" onclick="cikisYap()"><i class="fas fa-sign-out-alt text-danger"></i> Güvenli Çıkış</a>
        </div>

        <!-- Sağ İçerik -->
        <div class="col-md-10 offset-md-2 main-content">
            <h2 class="text-primary mb-4">Yeni Misafir Kaydı</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-4">
                        <form id="misafirForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ad</label>
                                    <input type="text" id="mAd" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Soyad</label>
                                    <input type="text" id="mSoyad" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">TC / Pasaport No</label>
                                <input type="text" id="mTc" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Telefon</label>
                                <input type="text" id="mTel" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">E-Posta Adresi</label>
                                <input type="email" id="mMail" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Doğum Tarihi</label>
                                <input type="date" id="mDogum" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">Sisteme Kaydet</button>
                        </form>
                        <div id="mesaj" class="alert alert-success mt-3 d-none text-center">Misafir başarıyla kaydedildi!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('misafirForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const yeniMisafir = {
            ad: document.getElementById('mAd').value,
            soyad: document.getElementById('mSoyad').value,
            tcPasaportNo: document.getElementById('mTc').value,
            telefon: document.getElementById('mTel').value,
            ePosta: document.getElementById('mMail').value,       // Yeni eklenen alan
            dogumTarihi: document.getElementById('mDogum').value  // Yeni eklenen alan
        };

        fetch('http://localhost:8080/api/misafirler', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(yeniMisafir)
        })
        .then(res => {
            if(res.ok) {
                document.getElementById('mesaj').classList.remove('d-none');
                document.getElementById('misafirForm').reset();
                setTimeout(() => document.getElementById('mesaj').classList.add('d-none'), 3000);
            } else {
                alert("Kayıt başarısız! TC Kimlik no veya E-posta sistemde zaten kayıtlı olabilir.");
            }
        })
        .catch(err => console.error(err));
    });

    function cikisYap() {
        if(confirm("Sistemden çıkmak istediğinize emin misiniz?")) window.location.href = "login.html";
    }
</script>
</body>
</html>
