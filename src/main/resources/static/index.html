<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otel Yönetim Sistemi - Ana Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 15px 20px; display: block; font-size: 1.1rem; transition: 0.3s; }
        .sidebar a:hover { background-color: #495057; color: white; border-left: 4px solid #0d6efd; }
        .sidebar i { margin-right: 10px; width: 25px; }
        .main-content { padding: 30px; }
        .stat-card { border-radius: 10px; color: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sol Menü (Sidebar) -->
        <div class="col-md-2 sidebar position-fixed">
            <h4 class="text-center text-white mb-4 border-bottom pb-3">
                <i class="fas fa-hotel"></i> Grand Otel
            </h4>
            <a href="index.html" class="active"><i class="fas fa-tachometer-alt"></i> Ana Panel</a>
            <a href="rezervasyon-listesi.html"><i class="fas fa-book"></i> Rezervasyonlar</a>
            <a href="rezervasyon-yap.html"><i class="fas fa-calendar-plus"></i> Yeni Rezervasyon</a>
            <a href="misafir-ekle.html"><i class="fas fa-user-plus"></i> Misafir Ekle</a>
            <a href="#" onclick="cikisYap()"><i class="fas fa-sign-out-alt text-danger"></i> Güvenli Çıkış</a>
        <a href="personel-listesi.html"><i class="fas fa-id-badge"></i> Personel Yönetimi</a>
        </div>

        <!-- Sağ İçerik Alanı -->
        <div class="col-md-10 offset-md-2 main-content">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Hoş Geldiniz, <span id="kullaniciAdi" class="text-primary">Yönetici</span></h2>
                <span class="badge bg-secondary fs-6">Sistem Durumu: Çevrimiçi</span>
            </div>

            <!-- Özet İstatistik Kartları -->
            <div class="row mb-5">
                <div class="col-md-4">
                    <div class="stat-card bg-primary">
                        <h4><i class="fas fa-bed"></i> Toplam Oda</h4>
                        <h2 id="toplamOda">-</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-success">
                        <h4><i class="fas fa-users"></i> Kayıtlı Misafir</h4>
                        <h2 id="toplamMisafir">-</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card bg-warning text-dark">
                        <h4><i class="fas fa-concierge-bell"></i> Aktif Rezervasyon</h4>
                        <h2 id="toplamRezervasyon">-</h2>
                    </div>
                </div>
            </div>

            <!-- Odaların Hızlı Görünümü (Eski index.html buraya entegre edildi) -->
            <h3 class="mb-3">Oda Durumları</h3>
            <div class="row" id="odaListesi">
                <!-- JavaScript ile odalar buraya dolacak -->
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        ozetVerileriGetir();
        odalariGetir();
    });

  // Otel istatistiklerini sayan fonksiyon
    function ozetVerileriGetir() {
        // Toplam Oda Sayısı
        fetch('http://localhost:8080/api/odalar')
            .then(r => r.json())
            .then(data => document.getElementById('toplamOda').innerText = data.length);
            
        // Toplam Misafir Sayısı
        fetch('http://localhost:8080/api/misafirler')
            .then(r => r.json())
            .then(data => document.getElementById('toplamMisafir').innerText = data.length);
            
        // SADECE Aktif Rezervasyonların Sayısı (Tamamlanmışları Çıkarıyoruz)
        fetch('http://localhost:8080/api/rezervasyonlar')
            .then(r => r.json())
            .then(data => {
                // Durumu 'tamamlandı' OLMAYANLARI filtrele
                let aktifler = data.filter(rez => rez.durum !== 'tamamlandı');
                document.getElementById('toplamRezervasyon').innerText = aktifler.length;
            });
    }

    // Odaları kart olarak çizen fonksiyon
    function odalariGetir() {
        fetch('http://localhost:8080/api/odalar')
            .then(response => response.json())
            .then(data => {
                const div = document.getElementById('odaListesi');
                div.innerHTML = '';
                data.forEach(oda => {
                    let renk = oda.durum === 'boş' ? 'bg-success' : (oda.durum === 'dolu' ? 'bg-danger' : 'bg-warning text-dark');
                    div.innerHTML += `
                        <div class="col-md-3 mb-3">
                            <div class="card shadow-sm border-0">
                                <div class="card-header text-white text-center ${renk}">
                                    <h5 class="m-0">Oda ${oda.odaNumarasi}</h5>
                                </div>
                                <div class="card-body text-center">
                                    <p class="mb-1">${oda.odaTipi.tipAdi}</p>
                                    <span class="badge ${renk}">${oda.durum.toUpperCase()}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    }

    function cikisYap() {
        if(confirm("Sistemden çıkmak istediğinize emin misiniz?")) {
            window.location.href = "login.html";
        }
    }
</script>

</body>
</html>
