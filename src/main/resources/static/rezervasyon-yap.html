<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yeni Rezervasyon Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 15px 20px; display: block; font-size: 1.1rem; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; border-left: 4px solid #0d6efd; }
        .main-content { padding: 40px; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 sidebar position-fixed">
            <h4 class="text-center text-white mb-4 border-bottom pb-3"><i class="fas fa-hotel"></i> Grand Otel</h4>
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> Ana Panel</a>
            <a href="rezervasyon-listesi.html"><i class="fas fa-book"></i> Rezervasyonlar</a>
            <a href="gelir-raporu.html"><i class="fas fa-chart-line"></i> Gelir Raporu</a>
            <a href="rezervasyon-yap.html" class="active"><i class="fas fa-calendar-plus"></i> Yeni Rezervasyon</a>
            <a href="misafir-ekle.html"><i class="fas fa-user-plus"></i> Misafir Ekle</a>
            <a href="personel-listesi.html"><i class="fas fa-id-badge"></i> Personel Yönetimi</a>
        </div>

        <!-- Sağ İçerik -->
        <div class="col-md-10 offset-md-2 main-content">
            <h2 class="text-primary mb-4">Rezervasyon Paneli</h2>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card p-4">
                        <form id="rezervasyonForm">
                            <div class="mb-3">
                                <label class="form-label">Misafir Seçin</label>
                                <select id="misafirSecim" class="form-select" required>
                                    <option value="">Yükleniyor...</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Oda Seçin</label>
                                <select id="odaSecim" class="form-select" required>
                                    <option value="">Yükleniyor...</option>
                                </select>
                            </div>

                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label">Giriş Tarihi</label>
                                    <input type="date" id="girisTarihi" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Çıkış Tarihi</label>
                                    <input type="date" id="cikisTarihi" class="form-control" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Rezervasyonu Onayla</button>
                        </form>
                        <div id="hataMesaj" class="alert alert-danger mt-3 d-none">Kayıt başarısız! Lütfen bilgileri kontrol edin.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Misafirleri Getir (undefined hatasını çözen kısım burası)
        fetch('http://localhost:8080/api/misafirler')
            .then(res => res.json())
            .then(data => {
                let secim = document.getElementById('misafirSecim');
                secim.innerHTML = '<option value="">Misafir Seçiniz...</option>';
                data.forEach(m => {
                    // tcPasaportNo değişkenini doğru çekiyoruz
                    secim.innerHTML += `<option value="${m.id}">${m.ad} ${m.soyad} (${m.tcPasaportNo || 'TC Yok'})</option>`;
                });
            });

        // Odaları Getir (Sadece Boş odaları listele)
        fetch('http://localhost:8080/api/odalar')
            .then(res => res.json())
            .then(data => {
                let secim = document.getElementById('odaSecim');
                secim.innerHTML = '<option value="">Oda Seçiniz...</option>';
                data.filter(o => o.durum.toLowerCase() === 'boş').forEach(o => {
                    secim.innerHTML += `<option value="${o.id}">Oda ${o.odaNumarasi} - ${o.odaTipi}</option>`;
                });
            });
    });

    // Rezervasyon Gönderme İşlemi
    document.getElementById('rezervasyonForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Java'nın beklediği formatta objeyi hazırlıyoruz
        const yeniRezervasyon = {
            misafir: { id: document.getElementById('misafirSecim').value },
            oda: { id: document.getElementById('odaSecim').value },
            girisTarihi: document.getElementById('girisTarihi').value,
            cikisTarihi: document.getElementById('cikisTarihi').value,
            durum: "beklemede" // Varsayılan durum
        };

        fetch('http://localhost:8080/api/rezervasyonlar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(yeniRezervasyon)
        })
        .then(res => {
            if(res.ok) {
                alert("Rezervasyon Başarıyla Oluşturuldu!");
                window.location.href = "rezervasyon-listesi.html";
            } else {
                document.getElementById('hataMesaj').classList.remove('d-none');
            }
        })
        .catch(err => console.error(err));
    });
</script>
</body>
</html>
