<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Personel Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 15px 20px; display: block; font-size: 1.1rem; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; border-left: 4px solid #0d6efd; }
        .sidebar i { margin-right: 10px; width: 25px; }
        .main-content { padding: 30px; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 sidebar position-fixed">
            <h4 class="text-center text-white mb-4 border-bottom pb-3"><i class="fas fa-hotel"></i> Grand Otel</h4>
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> Ana Panel</a>
            <a href="rezervasyon-listesi.html"><i class="fas fa-book"></i> Rezervasyonlar</a>
            <a href="rezervasyon-yap.html"><i class="fas fa-calendar-plus"></i> Yeni Rezervasyon</a>
            <a href="misafir-ekle.html"><i class="fas fa-user-plus"></i> Misafir Ekle</a>
            <a href="personel-listesi.html" class="active"><i class="fas fa-id-badge"></i> Personel Yönetimi</a>
            <a href="#" onclick="cikisYap()"><i class="fas fa-sign-out-alt text-danger"></i> Güvenli Çıkış</a>
        </div>

        <!-- Sağ İçerik -->
        <div class="col-md-10 offset-md-2 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-primary">Personel Yönetimi</h2>
            </div>

            <div class="row">
                <!-- Personel Ekleme Formu -->
                <div class="col-md-4">
                    <div class="card p-4 mb-4">
                        <h5 class="mb-3 text-success">Yeni Personel Ekle</h5>
                        <form id="personelForm">
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label small">Ad</label>
                                    <input type="text" id="pAd" class="form-control" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label small">Soyad</label>
                                    <input type="text" id="pSoyad" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Kullanıcı Adı</label>
                                <input type="text" id="pKullanici" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Şifre</label>
                                <input type="password" id="pSifre" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">İşe Giriş Tarihi</label>
                                <input type="date" id="pTarih" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">Görev (Rol)</label>
                                <select id="pGorev" class="form-select" required>
                                    <option value="Yönetici">Yönetici</option>
                                    <option value="Resepsiyon">Resepsiyon</option>
                                    <option value="Muhasebe">Muhasebe</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Personeli Kaydet</button>
                        </form>
                        <div id="mesaj" class="alert alert-success mt-2 d-none p-2 text-center small">Eklendi!</div>
                    </div>
                </div>

                <!-- Personel Listesi Tablosu -->
                <div class="col-md-8">
                    <div class="card p-4">
                        <h5 class="mb-3">Sistem Yetkilileri</h5>
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Ad Soyad</th>
                                    <th>Kullanıcı Adı</th>
                                    <th>Görev</th>
                                    <th>İşe Giriş</th>
                                </tr>
                            </thead>
                            <tbody id="personelTablosu">
                                <!-- Veriler JS ile gelecek -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", personelleriGetir);

    // Personelleri veritabanından çekip tabloya yazdır
    function personelleriGetir() {
        fetch('http://localhost:8080/api/personel')
            .then(r => r.json())
            .then(data => {
                const tablo = document.getElementById('personelTablosu');
                tablo.innerHTML = '';
                data.forEach(p => {
                    let rolRenk = p.gorev === 'Yönetici' ? 'text-danger fw-bold' : 'text-primary';
                    tablo.innerHTML += `
                        <tr>
                            <td>#${p.id}</td>
                            <td>${p.ad} ${p.soyad}</td>
                            <td>${p.kullaniciAdi}</td>
                            <td class="${rolRenk}">${p.gorev}</td>
                            <td>${p.iseGirisTarihi}</td>
                        </tr>
                    `;
                });
            });
    }

    // Yeni personel ekle
    document.getElementById('personelForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Entity ile %100 uyumlu veri paketi
        const yeniPersonel = {
            ad: document.getElementById('pAd').value,
            soyad: document.getElementById('pSoyad').value,
            kullaniciAdi: document.getElementById('pKullanici').value,
            sifre: document.getElementById('pSifre').value,
            iseGirisTarihi: document.getElementById('pTarih').value,
            gorev: document.getElementById('pGorev').value
        };

        fetch('http://localhost:8080/api/personel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(yeniPersonel)
        })
        .then(res => {
            if(res.ok) {
                document.getElementById('mesaj').classList.remove('d-none');
                document.getElementById('personelForm').reset();
                personelleriGetir(); // Tabloyu anında güncelle
                setTimeout(() => document.getElementById('mesaj').classList.add('d-none'), 3000);
            } else {
                alert("Hata oluştu! Kullanıcı adı daha önce alınmış olabilir.");
            }
        })
        .catch(err => console.error(err));
    });

    function cikisYap() {
        if(confirm("Sistemden çıkmak istediğinize emin misiniz?")) window.location.href = "login.html";
    }
</script>
</body>
</html>
