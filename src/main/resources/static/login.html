<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otel Sistemi - Giriş Yap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center text-primary mb-4">Otel Yönetim Sistemi</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="kullaniciAdi" class="form-label">Kullanıcı Adı</label>
                <input type="text" class="form-control" id="kullaniciAdi" required>
            </div>
            <div class="mb-3">
                <label for="sifre" class="form-label">Şifre</label>
                <input type="password" class="form-control" id="sifre" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Giriş Yap</button>
        </form>
        <div id="hataMesaji" class="alert alert-danger mt-3 d-none">
            Kullanıcı adı veya şifre hatalı!
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engelle

            const kAdi = document.getElementById('kullaniciAdi').value;
            const sifre = document.getElementById('sifre').value;

            // Yazdığımız Java Controller'ına POST isteği atıyoruz
            fetch(`http://localhost:8080/api/personel/login?kullaniciAdi=${kAdi}&sifre=${sifre}`, {
                method: 'POST'
            })
            .then(response => response.text())
            .then(text => {
                if (text) {
                    // Java'dan dolu bir cevap geldiyse (Giriş başarılı)
                    const personel = JSON.parse(text);
                    alert("Giriş Başarılı! Hoş geldin, " + personel.ad + " (" + personel.gorev + ")");
                    
                    // Başarılı girişte ana yönetim paneline yönlendir
                    window.location.href = "index.html"; 
                } else {
                    // Java'dan boş cevap geldiyse (Hatalı giriş)
                    document.getElementById('hataMesaji').classList.remove('d-none');
                }
            })
            .catch(error => console.error('Hata:', error));
        });
    </script>
</body>
</html>
