<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Rezervasyon Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 15px 20px; display: block; font-size: 1.1rem; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: white; border-left: 4px solid #0d6efd; }
        .sidebar i { margin-right: 10px; width: 25px; }
        .main-content { padding: 30px; }
        .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sol Menü (Tüm sayfalardaki standart menümüz) -->
        <div class="col-md-2 sidebar position-fixed">
            <h4 class="text-center text-white mb-4 border-bottom pb-3"><i class="fas fa-hotel"></i> Grand Otel</h4>
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> Ana Panel</a>
            <a href="rezervasyon-listesi.html" class="active"><i class="fas fa-book"></i> Rezervasyonlar</a>
            <a href="rezervasyon-yap.html"><i class="fas fa-calendar-plus"></i> Yeni Rezervasyon</a>
            <a href="misafir-ekle.html"><i class="fas fa-user-plus"></i> Misafir Ekle</a>
            <a href="personel-listesi.html"><i class="fas fa-id-badge"></i> Personel Yönetimi</a>
            <a href="#" onclick="cikisYap()"><i class="fas fa-sign-out-alt text-danger"></i> Güvenli Çıkış</a>
        </div>

        <!-- Sağ İçerik -->
        <div class="col-md-10 offset-md-2 main-content">
            <div class="table-container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-primary">Rezervasyon Listesi</h3>
                    <a href="rezervasyon-yap.html" class="btn btn-success"><i class="fas fa-plus"></i> Yeni Rezervasyon</a>
                </div>

                <table class="table table-hover table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Misafir</th>
                            <th>Oda No</th>
                            <th>Giriş Tarihi</th>
                            <th>Çıkış Tarihi</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="rezervasyonTablosu">
                        <!-- Veriler JavaScript ile dolacak -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        rezervasyonlariGetir();
    });

    // Tabloyu dolduran fonksiyon
    function rezervasyonlariGetir() {
        fetch('http://localhost:8080/api/rezervasyonlar')
            .then(response => response.json())
            .then(data => {
                const tablo = document.getElementById('rezervasyonTablosu');
                tablo.innerHTML = ''; 
                
                if(data.length === 0) {
                    tablo.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Kayıtlı rezervasyon yok.</td></tr>';
                    return;
                }

                data.forEach(rez => {
                    let durumRenk = '';
                    let butonHtml = '';

                    // Duruma göre renk ve buton ayarlamaları
                    if (rez.durum === 'tamamlandı') {
                        durumRenk = 'bg-secondary';
                        butonHtml = `<button class="btn btn-sm btn-secondary" disabled>Çıkış Yapıldı</button>`;
                    } else if (rez.durum === 'iptal') {
                        durumRenk = 'bg-danger';
                        butonHtml = `<button class="btn btn-sm btn-secondary" disabled>İptal Edildi</button>`;
                    } else {
                        durumRenk = 'bg-success'; // beklemede veya aktif
                        butonHtml = `
                            <button class="btn btn-sm btn-outline-danger me-1" onclick="checkOutYap(${rez.id})">Check-Out</button>
                            <button class="btn btn-sm btn-outline-warning text-dark" onclick="iptalEt(${rez.id})">İptal</button>
                        `;
                    }
                    
                    let misafirAd = rez.misafir ? rez.misafir.ad + ' ' + rez.misafir.soyad : '-';
                    let odaNo = rez.oda ? rez.oda.odaNumarasi : '-';

                    tablo.innerHTML += `
                        <tr>
                            <td>#${rez.id}</td>
                            <td>${misafirAd}</td>
                            <td>${odaNo}</td>
                            <td>${rez.girisTarihi}</td>
                            <td>${rez.cikisTarihi}</td>
                            <td><span class="badge ${durumRenk}">${rez.durum.toUpperCase()}</span></td>
                            <td>${butonHtml}</td>
                        </tr>
                    `;
                });
            })
            .catch(error => console.error('Hata:', error));
    }

    // Check-Out fonksiyonu (Para Hesaplamalı)
    function checkOutYap(id) {
        if(confirm("Müşteri çıkışını onaylıyor musunuz? Fatura hesaplanıp oda temizliğe alınacaktır.")) {
            fetch(`http://localhost:8080/api/rezervasyonlar/${id}/checkout`, { 
                method: 'PUT' 
            })
            .then(response => response.text()) // Java'dan double dönüyor
            .then(tutar => {
                alert("Çıkış işlemi başarılı!\n\nMüşterinin Ödeyeceği Toplam Tutar: " + tutar + " TL\n\nOda otomatik olarak temizliğe alındı.");
                rezervasyonlariGetir(); // Tabloyu anında güncelle
            })
            .catch(err => alert("İşlem sırasında hata oluştu!"));
        }
    }

    // Yeni Eklenen İptal Fonksiyonu
    function iptalEt(id) {
        if(confirm("Bu rezervasyonu İPTAL etmek istediğinize emin misiniz? Oda tekrar BOŞ durumuna geçecektir.")) {
            fetch(`http://localhost:8080/api/rezervasyonlar/${id}/iptal`, { 
                method: 'PUT' 
            })
            .then(response => {
                if(response.ok) {
                    alert("Rezervasyon iptal edildi ve oda boşa çıkarıldı.");
                    rezervasyonlariGetir(); // Tabloyu anında güncelle
                }
            });
        }
    }

    function cikisYap() {
        if(confirm("Sistemden çıkmak istediğinize emin misiniz?")) window.location.href = "login.html";
    }
</script>

</body>
</html>
